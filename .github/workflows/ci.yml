name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run PR test profile (capacity tests run in Extended CI)
        env:
          ARKITA_TEST_PROFILE: pr
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Install Chromium for renderer smoke
        if: matrix.os == 'ubuntu-24.04'
        run: npm exec playwright install --with-deps chromium

      - name: Run renderer browser smoke
        if: matrix.os == 'ubuntu-24.04'
        run: npm run test:browser:smoke

      - name: Build Windows NSIS installer
        if: runner.os == 'Windows'
        run: npm run package:win

      - name: Verify Windows installer in the runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path "release/windows" -Filter "Arkita-*-win-x64-setup.exe" -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one NSIS installer; found $($packages.Count)."
          }
          if ($packages[0].Length -lt 1MB) {
            throw "The generated NSIS installer is unexpectedly small."
          }
          Write-Output "Package smoke passed: $($packages[0].Name) ($($packages[0].Length) bytes)."

      - name: Install and launch Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path "release/windows" -Filter "Arkita-*-win-x64-setup.exe" -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one NSIS installer; found $($packages.Count)."
          }
          $installDir = Join-Path $env:RUNNER_TEMP "arkita-install-smoke-$env:GITHUB_RUN_ID"
          if (Test-Path $installDir) {
            throw "Refusing to replace an existing smoke installation: $installDir"
          }
          $install = Start-Process -FilePath $packages[0].FullName -ArgumentList @('/S', "/D=$installDir") -PassThru
          if (-not $install.WaitForExit(120000)) {
            Stop-Process -Id $install.Id -Force -ErrorAction SilentlyContinue
            throw "Silent NSIS install did not finish within 120 seconds."
          }
          $install.Refresh()
          if ($install.ExitCode -ne 0) {
            throw "Silent NSIS install failed with exit code $($install.ExitCode)."
          }
          $executable = Join-Path $installDir 'Arkita.exe'
          if (-not (Test-Path $executable -PathType Leaf)) {
            throw "Installed Arkita executable was not found: $executable"
          }
          $app = Start-Process -FilePath $executable -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(45)
            do {
              $app.Refresh()
              if ($app.HasExited) {
                throw "Installed Arkita exited before showing its main window (code $($app.ExitCode))."
              }
              if ($app.MainWindowHandle -ne 0) { break }
              Start-Sleep -Milliseconds 500
            } while ((Get-Date) -lt $deadline)
            $app.Refresh()
            if ($app.MainWindowHandle -eq 0) {
              throw "Installed Arkita did not show a main window within 45 seconds."
            }
            Write-Output "Installed Arkita launched with a main window: $($app.MainWindowTitle)."
          }
          finally {
            $app.Refresh()
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }

  ci-gate:
    name: CI gate
    if: always()
    needs: [validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every platform job to pass
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: |
          if [ "$VALIDATION_RESULT" != "success" ]; then
            echo "Platform validation result: $VALIDATION_RESULT"
            exit 1
          fi
